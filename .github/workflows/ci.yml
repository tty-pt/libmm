name: ci

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: tty-pt/ci/.github/workflows/all-in-one.yml@main
    with:
      name: libmm
      run_tests: true
      publish_to: "deb,apk,rpm,pacman,brew,openbsd,winget"
      publish_npm: true
      run_publish: ${{ startsWith(github.ref, 'refs/tags/') }}
      deps: "libstele,libcorm"
      deps_deb: "libstele,libcorm,libjoint,liblemma,libsepal,libislet"
      deps_pacman: "libstele,libcorm"
      deps_openbsd: "libstele,libcorm"
      deps_winget: "mingw-w64-x86_64-xxhash,mingw-w64-x86_64-mman-win32"
      deps_winget_tty: "libstele,libcorm"
    secrets: inherit
